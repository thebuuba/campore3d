<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legado 3D — Planificador</title><style>body{margin:0;font-family:system-ui;background:#f4f6f0;color:#253b2b}header{padding:12px 18px;background:#fff;border-bottom:1px solid #ddd}main{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 58px)}aside{padding:15px;overflow:auto;background:white;border-right:1px solid #ddd}label{display:block;margin:12px 0 4px;font-size:13px}input,select,button{box-sizing:border-box;width:100%;padding:9px;border:1px solid #cdd6c9;border-radius:7px;background:white}button{cursor:pointer;margin-top:8px;background:#e6f1e1}button:hover{background:#d2e9c8}canvas{display:block;width:100%;height:100%}#scene{position:relative;min-height:420px}small{color:#627267}h3{margin:16px 0 5px}#status{font-size:12px;margin-top:12px}@media(max-width:700px){main{display:flex;flex-direction:column;height:auto}aside{max-height:40vh}#scene{height:60vh}}</style></head><body><header><strong>🏕️ LEGADO 3D</strong> · Planificador de campamento</header><main><aside><strong>Terreno provisional</strong><label>Ancho (metros)</label><input id="width" type="number" min="12" max="150" value="40"><label>Largo (metros)</label><input id="length" type="number" min="12" max="200" value="60"><button id="resize">Actualizar terreno</button><label>Distribución</label><select id="layout"><option value="back">Servicios al fondo</option><option value="left">Servicios a la izquierda</option><option value="right">Servicios a la derecha</option></select><button id="arrange">Aplicar distribución</button><h3>Agregar estructuras</h3><select id="kind"><option value="tentM">Carpa varones</option><option value="tentF">Carpa hembras</option><option value="kitchen">Cocina</option><option value="bath">Baño tipo carpa</option><option value="bin">Zafacón</option><option value="gate">Entrada de madera</option><option value="exit">Salida secundaria</option><option value="post">Poste de madera</option><option value="beam">Travesaño de madera</option></select><button id="add">Agregar al campo</button><h3>Objeto seleccionado</h3><small>Haz clic en un objeto para seleccionarlo; arrástralo para moverlo.</small><label>Posición X (m)</label><input id="x" type="number" step="0.5"><label>Posición Z (m)</label><input id="z" type="number" step="0.5"><label>Rotación (grados)</label><input id="rot" type="number" step="5"><label>Escala</label><input id="scale" type="number" step="0.1" min="0.2" max="5"><button id="apply">Aplicar cambios</button><button id="duplicate">Duplicar</button><button id="remove">Eliminar</button><h3>Proyecto</h3><button id="save">Guardar en este navegador</button><button id="load">Recuperar guardado</button><button id="export">Exportar JSON</button><label>Importar JSON</label><input id="import" type="file" accept=".json"><button id="reset">Restaurar ejemplo</button><p id="status">Cargando visualizador…</p><small>Diseño conceptual: las dimensiones y estructuras requieren verificación antes del montaje.</small></aside><section id="scene"></section></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id), scene=new THREE.Scene();scene.background=new THREE.Color(0xeaf2f4);const camera=new THREE.PerspectiveCamera(55,1,.1,600);camera.position.set(48,55,65);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('scene').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.05;scene.add(new THREE.HemisphereLight(0xffffff,0x70865e,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(25,55,20);scene.add(sun);let W=40,L=60,items=[],selected=null,ground,outline,posts=[];const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.85});const materials={grass:mat(0x91bb7e),wood:mat(0x92613b),tentM:mat(0x538b67),tentF:mat(0xd29c66),kitchen:mat(0xc9a574),bath:mat(0x81b9c5),bin:mat(0x566f5b),highlight:mat(0xffd05b)};function box(w,h,d,m){let a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);a.position.y=h/2;return a}function make(kind){let g=new THREE.Group(),o;if(kind==='tentM'||kind==='tentF'||kind==='bath'){let s=new THREE.Mesh(new THREE.ConeGeometry(kind==='bath'?1.6:2.2,kind==='bath'?2.7:2.4,4),materials[kind]);s.rotation.y=Math.PI/4;s.position.y=kind==='bath'?1.35:1.2;g.add(s)}else if(kind==='kitchen'){g.add(box(6,.25,4,materials.wood));let roof=box(7,.2,5,materials.kitchen);roof.position.y=3.1;g.add(roof);for(let x of [-2.8,2.8])for(let z of [-1.8,1.8]){let p=box(.17,3,.17,materials.wood);p.position.set(x,1.5,z);g.add(p)}}else if(kind==='gate'||kind==='exit'){let span=kind==='gate'?5:3;for(let x of [-span/2,span/2]){let p=box(.24,3.4,.24,materials.wood);p.position.set(x,1.7,0);g.add(p)}let b=box(span+.5,.35,.3,materials.wood);b.position.y=3.3;g.add(b)}else if(kind==='post'){g.add(box(.2,2.2,.2,materials.wood))}else if(kind==='beam'){g.add(box(3,.2,.2,materials.wood))}else{g.add(box(.8,1,.8,materials.bin))}return g}function add(kind,x,z,rot=0,scale=1){let group=make(kind);group.position.set(x,0,z);group.rotation.y=rot;group.scale.setScalar(scale);group.userData={kind};scene.add(group);let data={kind,x,z,rot,scale,group};items.push(data);return data}function clear(){for(let a of items)scene.remove(a.group);items=[];selected=null}function perimeter(){if(ground)scene.remove(ground);if(outline)scene.remove(outline);posts.forEach(p=>scene.remove(p));posts=[];ground=box(W,.08,L,materials.grass);ground.position.y=-.04;scene.add(ground);let pts=[[-W/2,-L/2],[W/2,-L/2],[W/2,L/2],[-W/2,L/2],[-W/2,-L/2]].map(p=>new THREE.Vector3(p[0],.08,p[1]));outline=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x527543}));scene.add(outline);for(let x=-W/2;x<=W/2;x+=4){for(let z of [-L/2,L/2]){let p=box(.16,1.2,.16,materials.wood);p.position.set(x,.6,z);scene.add(p);posts.push(p)}}for(let z=-L/2;z<=L/2;z+=4){for(let x of [-W/2,W/2]){let p=box(.16,1.2,.16,materials.wood);p.position.set(x,.6,z);scene.add(p);posts.push(p)}}}function arrange(){clear();let mode=$('layout').value;for(let i=0;i<12;i++){let row=Math.floor(i/3),col=i%3;let x=-W*.38+col*W*.11,z=-L*.30+row*L*.11;if(mode==='left')x+=W*.12;add('tentM',x,z);add('tentF',-x,z)}if(mode==='back'){add('kitchen',-W*.27,-L*.39);add('bath',W*.27,-L*.39)}else{let side=mode==='left'?-1:1;add('kitchen',side*W*.38,-L*.3,Math.PI/2);add('bath',side*W*.38,L*.1)}add('gate',0,L/2-2);add('bin',0,-L*.18);status('Distribución provisional creada.')}function status(t){$('status').textContent=t}function select(a){selected=a;for(let it of items)it.group.traverse(o=>{if(o.isMesh&&o.userData.original)o.material=o.userData.original});if(a){a.group.traverse(o=>{if(o.isMesh){o.userData.original=o.material;o.material=materials.highlight}});$('x').value=a.x.toFixed(1);$('z').value=a.z.toFixed(1);$('rot').value=Math.round(a.rot*180/Math.PI);$('scale').value=a.scale}}function update(){if(!selected)return;selected.x=+ $('x').value;selected.z=+$('z').value;selected.rot=+$('rot').value*Math.PI/180;selected.scale=+$('scale').value;selected.group.position.set(selected.x,0,selected.z);selected.group.rotation.y=selected.rot;selected.group.scale.setScalar(selected.scale)}function state(){return{W,L,items:items.map(({kind,x,z,rot,scale})=>({kind,x,z,rot,scale}))}}function restore(s){W=+s.W;L=+s.L;$('width').value=W;$('length').value=L;clear();perimeter();for(let a of s.items)add(a.kind,a.x,a.z,a.rot,a.scale);status('Proyecto cargado.')}const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0);let drag=false;function point(e){let r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mouse,camera)}renderer.domElement.addEventListener('pointerdown',e=>{point(e);let hits=ray.intersectObjects(items.map(a=>a.group),true);if(hits.length){let obj=hits[0].object;while(obj.parent&&!obj.userData.kind)obj=obj.parent;select(items.find(a=>a.group===obj));drag=true;controls.enabled=false}else select(null)});window.addEventListener('pointerup',()=>{drag=false;controls.enabled=true});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||!selected)return;point(e);let p=new THREE.Vector3();if(ray.ray.intersectPlane(plane,p)){selected.x=Math.max(-W/2,Math.min(W/2,p.x));selected.z=Math.max(-L/2,Math.min(L/2,p.z));selected.group.position.set(selected.x,0,selected.z);$('x').value=selected.x.toFixed(1);$('z').value=selected.z.toFixed(1)}});$('resize').onclick=()=>{W=Math.max(12,+$('width').value);L=Math.max(12,+$('length').value);perimeter();status('Terreno actualizado.')};$('arrange').onclick=arrange;$('add').onclick=()=>select(add($('kind').value,0,0));$('apply').onclick=update;$('duplicate').onclick=()=>{if(selected)select(add(selected.kind,selected.x+3,selected.z+3,selected.rot,selected.scale))};$('remove').onclick=()=>{if(selected){scene.remove(selected.group);items=items.filter(a=>a!==selected);selected=null}};$('save').onclick=()=>{localStorage.setItem('legado3d',JSON.stringify(state()));status('Guardado en este navegador.')};$('load').onclick=()=>{let s=localStorage.getItem('legado3d');if(s)restore(JSON.parse(s));else status('No hay guardado.')};$('export').onclick=()=>{let b=new Blob([JSON.stringify(state(),null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='legado-campamento.json';a.click();URL.revokeObjectURL(u)};$('import').onchange=async e=>{let f=e.target.files[0];if(f)try{restore(JSON.parse(await f.text()))}catch{status('Archivo no válido.')}};$('reset').onclick=arrange;function render(){let r=$('scene').getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();controls.update();renderer.render(scene,camera)}function loop(){requestAnimationFrame(loop);render()}perimeter();arrange();controls.target.set(0,0,0);loop();</script></body></html>
